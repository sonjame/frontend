    <title>Document</title>

      * {
        box-sizing: border-box;
      }
      div {
        width: 100px;
        height: 100px;

      }

        요소(width,height) + padding + border

        content-box: w,h 크기는 content 만 적용
    -->
    <div></div>
  </body>
