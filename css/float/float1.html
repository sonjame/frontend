<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 
      float
      1. float 속성은 위로 뜨는 상태
      2. 속성 지정하면 지정한 높이나 어비를 반영해 블록 요소처럼 동작
      3. clear:방향; clear:left; clear:right; clear:both; => float 속성 해제
      문제점 : 부모의 크기 문제
        - clear
        - 부모에 overflow:hidden
        - 가상요소
    -->
    <style>
      .red,
      .blue,
      .green {
        margin: 0.5em;
        height: 160px;
        text-align: center;
        border-radius: 4px;
        color: white;
      }
      .blue {
        width: 160px;
        background-color: slateblue;
        float: right;
      }
      .red {
        width: 240px;
        height: 240px;
        background-color: tomato;
        float: right;
      }
      .green {
        width: 160px;
        background-color: olivedrab;
        float: right;
      }
      .gray {
        padding: 0.8em;
        background-color: #eee;
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="result">
      <h1>float와 clear 속성</h1>
      <div class="blue">파랑 div</div>
      <div class="red">빨강 div</div>
      <span class="green">초록 span</span>
      <div class="gray">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Perferendis praesentium corrupti error cum deserunt
        quos architecto, esse placeat recusandae possimus sapiente molestias vitae ipsam iure hic voluptates quam
        repellendus nisi?
      </div>
    </div>
  </body>
</html>
