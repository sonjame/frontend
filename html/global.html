<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 속성 : 전역속성
        1) name 
        2) class
        3) id
        4) style
        5) data-*
    -->
    <p name="" class="" id="" style="" data-content="">
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Adipisci nemo
      harum similique aspernatur molestiae dolore veritatis, corporis, modi
      ratione, eaque nam. Inventore quaerat nam cumque ad dolore quos,
      reprehenderit facilis.
    </p>
    <!-- 인라인 vs 블럭 => 요소사 배치되는 방식
        인라인 : 옆으로 배치되는 요소 => label, input, span, a....
        블럭 : 하나의 행을 다 쓰는 요소 => div, p....
    -->
    <a href="#">네이버</a>
    <a href="#">구글</a>
    <a href="#">다음</a>
    <form action="">
      <label for="">이름</label>
      <input type="radio" name="" id="" />
      <label for="">전화번호</label>
      <input type="text" name="" id="" />
    </form>
  </body>
</html>
