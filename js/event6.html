<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Light</h1>
    <div>
      <button type="button">switch</button>
      <img src="./data/pic_bulboff.gif" alt="" />
    </div>
    <script>
      // 이벤트버블링 => 이벤트위임
      const div = document.querySelector("div");
      // img 찾기
      const img = document.querySelector("img");
      let mode = true;
      div.addEventListener("click", (e) => {
        if (mode) {
          img.src = "./data/pic_bulbon.gif";
          mode = false;
        } else {
          img.src = "./data/pic_bulboff.gif";
          mode = true;
        }
      });
    </script>
  </body>
</html>
