<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      table {
        width: 500px;
      }
    </style>
  </head>
  <body>
    <table id="outside">
      <tr>
        <td id="t1">one</td>
      </tr>
      <tr>
        <td id="t2">two</td>
      </tr>
    </table>
    <script>
      // table click 시 two, three 번갈아가면서 나오도록
      const outside = document.getElementById("outside");
      outside.addEventListener("click", () => {
        // t2의 text가 two or three
        const t2 = document.querySelector("#t2");

        const isNodeThree = t2.textContent === "three";
        t2.textContent = isNodeThree ? "two" : "three";
      });
    </script>
  </body>
</html>
