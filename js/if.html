<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 브라우저에서 제공하는 함수
      // parseInt(), Number()
      const num = Number(prompt("숫자 입력"));
      console.log(num);
      console.log(typeof num);

      if (num > 0) {
        console.log("양수");
      } else {
        console.log("음수");
      }
    </script>
  </body>
