<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container text-center">
      <div class="row">
        <div class="col">
          <img src="https://placehold.co/600" alt="" class="w-100" />
          <h5>정장 셔츠</h5>
          <p>가격 : <span>23900</span></p>
        </div>
        <div class="col">
          <img src="https://placehold.co/600" alt="" class="w-100" />
          <h5>맨투맨</h5>
          <p>가격 : <span>35000</span></p>
        </div>
        <div class="col">
          <img src="https://placehold.co/600" alt="" class="w-100" />
          <h5>가디건</h5>
          <p>가격 : <span>15000</span></p>
        </div>
      </div>
    </div>
    <script>
      const products = [
        { id: 0, price: 70000, title: "Blossom Dress" },
        { id: 1, price: 50000, title: "Springfield Shirt" },
        { id: 2, price: 80000, title: "Black Monastery" },
      ];

      const cols = document.querySelectorAll(".col");

      products.forEach((item, idx) => {
        // console.log(idx, "", item);
        // console.log(cols[idx].querySelector("h5"));
        // console.log(cols[idx].querySelector("p>span"));
        // 개별요소 접근
        // console.log(item.price);
        // console.log(item.title);
        cols[idx].querySelector("h5").textContent = item.title;
        cols[idx].querySelector("p > span").textContent = item.price;
      });
    </script>
  </body>
</html>
